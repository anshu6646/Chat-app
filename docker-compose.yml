services:
  front:
    build: ./public
    ports:
      - "3000:3000"
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:3000
      MONGO_URL: mongodb://mongo:27017/chat
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
